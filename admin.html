<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>West Coast Trip — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <header class="top">
    <h1>West Coast Trip admin</h1>
    <div class="top-actions">
      <button type="button" id="add-photos">Add photos</button>
      <button type="button" id="save-json">Save trip.json</button>
      <a class="view-album" href="./index.html" target="_blank" rel="noopener">View album</a>
      <p id="save-status" class="save-status" aria-live="polite"></p>
    </div>
    <input id="file-input" type="file" accept="image/*" multiple hidden>
  </header>

  <main class="layout">
    <aside class="leg-panel">
      <h2>Sites</h2>
      <ul id="leg-list" class="leg-list"></ul>
      <div class="new-leg">
        <label for="leg-title">New site</label>
        <div class="row">
          <input id="leg-title" type="text" placeholder="Pacific Coast Highway">
          <button type="button" id="add-leg">Add</button>
        </div>
      </div>
    </aside>

    <div class="editor">
      <section id="inbox-section" class="inbox-section" hidden>
        <h2>Unassigned</h2>
        <p class="hint">These were removed from a site. Select them, then <strong>Add selected</strong> on the open site.</p>
        <div id="inbox" class="photo-grid"></div>
      </section>

      <section id="leg-editor"></section>
    </div>
  </main>

  <script src="./js/admin.js"></script>
</body>
</html>
